<!DOCTYPE html>

<meta name="description" content="查询 DeepSeek 当前是否处于高峰计费时段，并给出今天与未来 14 天的排期。高峰时段规则转录自官方定价页，判断逻辑复刻自本地 macOS 应用。">

<header class="page-header">

</header>

  <div id="slot-status"></div>
